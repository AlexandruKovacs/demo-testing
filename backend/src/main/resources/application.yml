server:
  port: 8080

spring:
  application:
    name: titulizacion-poc

  datasource:
    url: jdbc:h2:mem:titulizacion;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    com.titulizacion.poc: INFO
